name: Release

# Builds installers for Windows and Linux, on both amd64 and arm64, and
# publishes them to a GitHub Release whenever a version tag (v1.2.3) is
# pushed. Each OS/arch combo is built natively on a matching GitHub-hosted
# runner rather than cross-compiled, since Wails apps use CGO (webkit2gtk
# on Linux, WebView2 on Windows) which doesn't cross-compile reliably.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            experimental: false
          - os: windows-11-arm
            arch: arm64
            # windows-11-arm is a newer GitHub-hosted runner image; if it's
            # ever unavailable this leg fails without blocking the release
            # of the amd64 build.
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: choco install nsis -y
        shell: pwsh

      - name: Build installer
        working-directory: app
        run: wails build -clean -platform windows/${{ matrix.arch }} -nsis
        # The NSIS script (build/windows/installer/project.nsi) bundles
        # wintun.dll from app/resources/windows/wintun/${{ matrix.arch }}/
        # into the installer itself, so installed users get it automatically.

      - name: Also stage a portable (non-installer) copy
        shell: pwsh
        run: Copy-Item "app/resources/windows/wintun/${{ matrix.arch }}/wintun.dll" "app/build/bin/wintun.dll"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            app/build/bin/*.exe
            app/build/bin/*.dll

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            experimental: false
          - os: ubuntu-24.04-arm
            arch: arm64
            # Same reasoning as windows-11-arm above: don't let an
            # unavailable/flaky arm64 runner block the amd64 release.
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build
        working-directory: app
        # webkit2gtk-4.0 isn't packaged on modern Ubuntu (24.04+) — only
        # 4.1 is available (installed above) — so Wails needs the
        # webkit2_41 build tag to link against it instead of its 4.0
        # default (see pkg/assetserver/webview/webkit2_40+.go upstream).
        run: wails build -clean -tags webkit2_41 -platform linux/${{ matrix.arch }}

      - name: Package .deb and .rpm
        working-directory: app/build/linux
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}"
          nfpm pkg --config nfpm.yaml --packager deb --target ../bin/vprotocol_${VERSION}_${ARCH}.deb
          nfpm pkg --config nfpm.yaml --packager rpm --target ../bin/vprotocol_${VERSION}_${ARCH}.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            app/build/bin/*.deb
            app/build/bin/*.rpm
            app/build/bin/vprotocol

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
